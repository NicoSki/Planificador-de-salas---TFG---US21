server {
  listen 80;
  root /usr/share/nginx/html;

  #La API en el mismo origen que la interfaz
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr; # reemplaza, no agrega: el cliente no puede falsear su IP
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}
